<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AL-76</title>
<style>
  /* Same palette as the Windows status window and the Mac settings: dark, cyan accent. */
  :root { --bg: #0b1220; --card: #111a2c; --line: #1e2a44; --text: #e6edf7; --dim: #8fa3c0; --accent: #4fdbff; --warn: #ffb547; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, "Ubuntu", "Cantarell", sans-serif; }
  main { padding: 22px 24px 28px; }
  h1 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: .5px; }
  .phase { color: var(--dim); margin: 2px 0 16px; }
  .warning { display: none; border: 1px solid var(--warn); color: var(--warn); border-radius: 8px; padding: 10px 12px; margin-bottom: 14px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
  h2 { margin: 0 0 6px; font-size: 12px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--accent); font-weight: 600; }
  p { margin: 3px 0; overflow-wrap: anywhere; }
  ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
</style>
</head>
<body>
<main>
  <h1 id="name">AL-76</h1>
  <div class="phase" id="phase"></div>
  <div class="warning" id="warning"></div>
  <div id="sections"></div>
</main>
<script>
  const host = window.chrome?.webview;
  host?.addEventListener('message', (e) => {
    const m = e.data;
    if (m.type !== 'status') return;
    document.getElementById('name').textContent = m.name || 'AL-76';
    document.getElementById('phase').textContent = m.phase || '';
    const warning = document.getElementById('warning');
    warning.textContent = m.warning || '';
    warning.style.display = m.warning ? 'block' : 'none';
    const root = document.getElementById('sections');
    root.replaceChildren(...(m.sections || []).map((s) => {
      const section = document.createElement('section');
      const h = document.createElement('h2'); h.textContent = s.title; section.append(h);
      for (const line of s.lines) { const p = document.createElement('p'); p.textContent = line; section.append(p); }
      return section;
    }));
  });
  host?.postMessage({ type: 'ready' });
</script>
</body>
</html>
